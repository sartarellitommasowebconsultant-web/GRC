<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="GRC - Genera link recensioni Google Maps">
  <title>GRC — Review Link Generator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <div class="logo">
          <img src="icon-192.png" alt="" class="logo-img" width="56" height="56">
        </div>
        <h1 class="card-title">GRC</h1>
        <p class="card-subtitle">Review Link Generator</p>
      </div>

      <!-- Input Section -->
      <div class="input-section">
        <label for="searchInput" class="input-label">Cerca attività</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M21 21l-4.35-4.35" stroke="#5f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="11" cy="11" r="7" stroke="#5f6368" stroke-width="2" fill="none"/>
          </svg>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Nome attività o link Google Maps..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="go"
            maxlength="2000"
          >
        </div>
        <div class="input-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="#1a73e8"/>
          </svg>
          <span>Inserisci un nome o un link da Google Maps</span>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generateBtn" class="generate-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L10 14l4.59-4.59L16 11l-6 6z" fill="white"/>
        </svg>
        <span>Genera Link</span>
      </button>

      <!-- Loading State -->
      <div id="loading" class="loading-state hidden" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Cerco l'attività...</p>
      </div>

      <!-- Result Section -->
      <div id="resultSection" class="result-section hidden" aria-live="polite">
        <div class="result-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="#188038"/>
          </svg>
          <span>Link generato!</span>
        </div>
        <div class="result-place">
          <div id="placeName" class="result-place-name"></div>
          <div id="placeAddress" class="result-place-address"></div>
        </div>
        <div class="result-link-container">
          <a id="resultLink" href="#" target="_blank" rel="noopener noreferrer" class="result-link">
            <span id="resultText"></span>
          </a>
        </div>
        <div class="action-buttons">
          <button id="copyBtn" class="action-btn" type="button">
            <svg id="copyIcon" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="#1a73e8"/>
            </svg>
            <span id="copyText">Copia link</span>
          </button>
          <button id="shareBtn" class="action-btn share-btn hidden" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z" fill="#1a73e8"/>
            </svg>
            <span id="shareText">Condividi</span>
          </button>
        </div>
      </div>

      <!-- Error Section -->
      <div id="errorSection" class="error-section hidden" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="#c5221f"/>
        </svg>
        <p id="errorMessage">Errore</p>
      </div>
    </div>

    <!-- Install Banner -->
    <div id="installBanner" class="install-banner hidden">
      <button id="installBtn" class="install-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M19 8h-1V3H6v5H4v12h16V8h-1zm-2 10H5V10h14v8zm-3-4l-4-4h2V8h-4v2h-2V8h-4v4h2l4 4v2h4v-2z" fill="#1a73e8"/>
        </svg>
        <span>Salva come App</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>GRC v1.1</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
